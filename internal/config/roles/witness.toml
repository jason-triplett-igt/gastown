# Witness role definition
# Fresh-context reviewer and health monitor per rig.

role = "witness"
scope = "rig"
nudge = "Check current rig state and inspect active work."
prompt_template = "witness.md.tmpl"
profile = "reviewer"
hook_policy = "reviewer"
allowed_tools = ["bd_show", "load_review", "run_verification"]

[session]
pattern = "{prefix}-witness"
work_dir = "{town}/{rig}/witness"
needs_pre_sync = false
start_command = "exec claude --dangerously-skip-permissions"

[env]
GT_ROLE = "{rig}/witness"
GT_SCOPE = "rig"

[health]
ping_timeout = "30s"
consecutive_failures = 3
kill_cooldown = "5m"
stuck_threshold = "1h"
