# Polecat role definition
# Persistent identity, ephemeral sessions. Batch work dispatch. Multiple per rig.

role = "polecat"
scope = "rig"
nudge = "Check your hook for work assignments."
prompt_template = "polecat.md.tmpl"
profile = "builder"
hook_policy = "builder"
allowed_tools = ["bd_show", "run_single_test", "run_unit_tests"]

[session]
pattern = "{prefix}-{name}"
work_dir = "{town}/{rig}/polecats/{name}"
needs_pre_sync = false
start_command = "exec claude --dangerously-skip-permissions"

[env]
GT_ROLE = "{rig}/polecats/{name}"
GT_SCOPE = "rig"

[health]
ping_timeout = "30s"
consecutive_failures = 3
kill_cooldown = "5m"
stuck_threshold = "2h"
